[workspace]
members = ["audio"]

[package]
name = "meetlog"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
#
# `cdylib` is omitted: it is only needed for mobile targets, and the MinGW
# linker fails on the resulting DLL with "export ordinal too large".
name = "meetlog_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
meetlog-audio = { path = "audio" }
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "time", "macros", "process"] }
anyhow = "1"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
keyring = { version = "3", features = ["windows-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
