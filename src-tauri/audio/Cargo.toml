[package]
name = "meetlog-audio"
version = "0.1.0"
edition = "2021"
description = "Microphone and Windows system-audio capture for Meetlog"

[dependencies]
cpal = "0.16"
tokio = { version = "1", features = ["sync"] }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
env_logger = "0.11"
